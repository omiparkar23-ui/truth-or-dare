name: Build Android AppBundle

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Keystore and Auto Save
        run: |
          mkdir -p android/app
          if [ ! -f android/app/upload-keystore.jks ]; then
            echo "Creating permanent keystore..."
            keytool -genkey -v -keystore android/app/upload-keystore.jks \
              -alias upload -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass truthordare123 -keypass truthordare123 \
              -dname "CN=TruthOrDare, OU=App, O=Tejas, L=City, S=State, C=IN"
            
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git add android/app/upload-keystore.jks
            git commit -m "chore: save fixed keystore" || true
            git push origin main || true
          fi

          cat <<EOF > android/key.properties
          storePassword=truthordare123
          keyPassword=truthordare123
          keyAlias=upload
          storeFile=upload-keystore.jks
          EOF

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Signed AAB
        run: flutter build appbundle --release

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
