name: Build Android AppBundle
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Create Release Keystore & Configure Signing
        run: |
          keytool -genkey -v -keystore android/app/upload-keystore.jks \
            -alias upload -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass truthordare123 -keypass truthordare123 \
            -dname "CN=TruthOrDare, OU=Dev, O=App, L=City, S=State, C=IN"
          
          cat <<EOF > android/key.properties
          storePassword=truthordare123
          keyPassword=truthordare123
          keyAlias=upload
          storeFile=upload-keystore.jks
          EOF

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Get Dependencies
        run: flutter pub get

      - name: Build Signed AAB
        run: flutter build appbundle --release --no-tree-shake-icons

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
